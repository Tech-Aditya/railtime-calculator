# Render Blueprint: one stateless Docker web service (no database or other infrastructure).
# Deploy: Render dashboard → New → Blueprint → pick this repository.
# Reference: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: railtime-calculator
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore               # closest Render region to India (lowest latency for IST users)
    plan: free                      # free instances sleep when idle; starter or higher stays always on
    autoDeploy: true
    # Ready only once the Spring context is up; Render waits for this before switching traffic.
    healthCheckPath: /actuator/health/readiness
    # On a paid plan you can add `maxShutdownDelaySeconds: 30` (time Render waits after SIGTERM).
    # The free plan doesn't accept it; Render's default delay already covers SHUTDOWN_TIMEOUT (20s).
    # Rebuild only when something that goes into the image changes (not for README or CI edits).
    buildFilter:
      paths:
        - src/**
        - pom.xml
        - Dockerfile
        - .dockerignore
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Swagger UI / OpenAPI at /swagger-ui.html; keep off unless you want the API docs public.
      - key: API_DOCS_ENABLED
        value: "false"
      # Optional. Public URL for canonical / share links; defaults to Render's RENDER_EXTERNAL_URL.
      # Set it when you add a custom domain.
      - key: SITE_URL
        sync: false
      # Optional. Comma-separated origins allowed to call the API from other sites (CORS).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # PORT is provided by Render automatically; the app binds to it (server.port=${PORT:8080}).
