# Render Blueprint: one stateless Docker web service (no database or other infrastructure).
# Deploy: Render dashboard → New → Blueprint → pick this repository.
services:
  - type: web
    name: railtime-calculator
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free                      # change to starter or higher for an always-on instance
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Swagger UI / OpenAPI at /swagger-ui.html; keep off unless you want the API docs public.
      - key: API_DOCS_ENABLED
        value: "false"
      # Optional. Public URL for canonical / share links; defaults to Render's RENDER_EXTERNAL_URL.
      # Set it when you add a custom domain.
      - key: SITE_URL
        sync: false
      # Optional. Comma-separated origins allowed to call the API from other sites (CORS).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # PORT is provided by Render automatically; the app binds to it (server.port=${PORT:8080}).
