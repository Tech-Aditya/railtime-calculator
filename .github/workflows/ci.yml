# Tests, coverage gate and a production image build on every push and pull request.
# Render deploys from the main branch on its own (render.yaml); this workflow catches problems first.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify (tests + JaCoCo gate)
        run: ./mvnw -B -ntp verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build production image (tests already ran above)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: railtime-calculator:ci
          build-args: SKIP_TESTS=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name railtime -p 8080:8080 railtime-calculator:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/actuator/health/readiness && break
            sleep 2
          done
          curl -fsS http://localhost:8080/actuator/health/readiness
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsS -X POST http://localhost:8080/api/v1/booking/general/calculate \
            -H 'Content-Type: application/json' -d "{\"originDepartureDate\":\"$(date -d '+30 days' +%F)\"}"
      - name: Container logs
        if: always()
        run: docker logs railtime || true
