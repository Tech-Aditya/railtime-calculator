info.refund=सामान्य ट्रेनों के कन्फ़र्म टिकट (अप्रैल 2026 में संशोधित स्लैब): प्रस्थान से {0} घंटे से पहले फ़्लैट शुल्क, {0} से {1} घंटे तक किराये का 25%, {1} से {2} घंटे तक 50%, और {2} घंटे के भीतर कोई रिफ़ंड नहीं। कन्फ़र्म तत्काल टिकट पर कोई रिफ़ंड नहीं मिलता; RAC और वेटलिस्ट टिकट पर प्रति यात्री ₹{3} क्लर्केज कटता है। सुविधा शुल्क वापस नहीं होता।
