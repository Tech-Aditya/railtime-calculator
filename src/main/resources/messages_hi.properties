info.chart=पहला चार्ट 16 दिसंबर 2025 के रेलवे बोर्ड पत्र के अनुसार बनता है: {0} से {1} के बीच प्रस्थान वाली ट्रेनों का पिछले दिन {2} तक, बाकी सभी का प्रस्थान से {3} घंटे पहले। चार्ट का समय बदल सकता है; चार्ट की स्थिति IRCTC पर जाँचें।
