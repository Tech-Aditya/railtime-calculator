info.aadhaar=On the opening day, from {0} IST until midnight, only Aadhaar-authenticated IRCTC users can book general reserved tickets online (since 12 January 2026). Counter bookings are not affected.
info.tatkalAadhaar=Online Tatkal booking needs an Aadhaar-authenticated IRCTC account and an OTP. Authorised agents cannot book in the first {0} minutes of each Tatkal window.
info.refund=Confirmed tickets on standard trains (slabs revised in April 2026): flat charge more than {0} hours before departure, 25% of fare from {0} to {1} hours, 50% from {1} to {2} hours, and no refund within {2} hours. Confirmed Tatkal tickets get no refund; RAC and waitlisted tickets pay ₹{3} clerkage per passenger. Convenience fees are not refunded.
info.refundPremium=Vande Bharat Sleeper and Amrit Bharat II trains: {1}% of fare is deducted more than {0} hours before departure, {2}% from {0} to {3} hours, and there is no refund within {3} hours. Vande Bharat Sleeper has no RAC.
info.chart=First charts follow the Railway Board letter of 16 December 2025: departures from {0} to {1} by {2} the previous day, all others {3} hours before departure. Charting times can be revised; check the chart status on IRCTC.
