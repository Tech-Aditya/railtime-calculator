info.tatkal=Tatkal opens {0,choice,1#one day|1<{0} days} before the origin departure date: {1} IST for AC classes, {2} IST for non-AC classes. Quota varies by train.
info.firstAc=1A is not listed under the standard Tatkal classes, so no Tatkal time is calculated for it.
info.refund=Refunds follow the Railway Passengers (Cancellation of Tickets and Refund of Fares) Rules, 2015. Confirmed Tatkal tickets get no refund; RAC and waitlisted tickets pay ₹{0} clerkage per passenger. Convenience fees are not refunded.
