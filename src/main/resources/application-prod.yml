# Production profile: minimal JSON logs, Swagger off unless API_DOCS_ENABLED=true,
# proxy-aware, no error detail. Security headers are always on (see SecurityConfig).
railtime:
  docs:
    enabled: ${API_DOCS_ENABLED:false}
  errors:
    include-exception-detail: false

server:
  # Honour X-Forwarded-* from a trusted reverse proxy / load balancer (TLS termination).
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: ${SERVER_MAX_THREADS:100}
    connection-timeout: 10s

logging:
  # One JSON object per line (Elastic Common Schema): Render's log view and any log service can
  # filter on fields. The request id from RequestLoggingFilter is included as "requestId".
  structured:
    format:
      console: ecs
    ecs:
      service:
        environment: prod
  level:
    root: WARN
    com.example.railtime: INFO
    org.springframework.boot.web.embedded: INFO
