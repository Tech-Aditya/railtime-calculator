# Development profile: verbose logging, Swagger on, live template/asset reload.
spring:
  thymeleaf:
    cache: false
  web:
    resources:
      chain:
        cache: false
      cache:
        cachecontrol:
          max-age: 0

railtime:
  docs:
    enabled: ${API_DOCS_ENABLED:true}
  errors:
    include-exception-detail: true

management:
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    # Compact, readable console: time, level, class, request id (see RequestLoggingFilter), message.
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr(%-28.28logger{0}){cyan} %clr(%-8.8X{requestId:-}){magenta} %m%n%wEx"
  level:
    root: INFO
    com.example.railtime: DEBUG
    # Framework start-up chatter adds nothing day to day; warnings and errors still show.
    org.springframework: WARN
    org.apache: WARN
