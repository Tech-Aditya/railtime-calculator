# ---------------------------------------------------------------------------
# RailTime Calculator — shared configuration (all profiles)
# Profile-specific overrides: application-dev.yml, application-prod.yml
# Secrets are never stored here; everything environment-specific is an env var.
# ---------------------------------------------------------------------------
spring:
  application:
    name: railtime-calculator
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    banner-mode: off
  # Graceful shutdown: on SIGTERM (e.g. a Render deploy) stop accepting requests and let
  # in-flight ones finish for up to this long.
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
  thymeleaf:
    cache: true
  # Web interface translations: messages.properties (English) + messages_<lang>.properties.
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  web:
    resources:
      # Fingerprinted asset URLs (app-<hash>.css) allow year-long immutable caching.
      chain:
        strategy:
          content:
            enabled: true
            paths: /css/**,/js/**
      cache:
        cachecontrol:
          max-age: 365d
          cache-public: true

server:
  # Render (and most PaaS) inject PORT; 8080 locally.
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    # Spring serves .js as text/javascript (RFC 9239); application/javascript kept for older clients.
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml,application/manifest+json
    min-response-size: 1KB
  tomcat:
    keep-alive-timeout: 20s
    max-keep-alive-requests: 200
  error:
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

# ---------------------------------------------------------------------------
# IRCTC booking rules. Change here (or via env vars) when IRCTC changes a rule.
# Source: official IRCTC website — verify before changing.
# ---------------------------------------------------------------------------
booking:
  timezone: Asia/Kolkata
  general:
    # Advance Reservation Period, excluding the date of journey (60 days since 1 Nov 2024).
    # On the opening day only Aadhaar-authenticated users can book online until midnight (since 12 Jan 2026).
    advance-days: ${BOOKING_ARP_DAYS:60}
    opening-time: "08:00"
  tatkal:
    days-before-departure: 1
    ac-opening-time: "10:00"
    non-ac-opening-time: "11:00"
    agent-blackout-minutes: 30   # authorised agents barred from the first 30 minutes (since July 2025)
  validation:
    max-days-in-past: 365
    max-days-in-future: 730
  # Cancellation charges: Railway Passengers (Cancellation of Ticket and Refund of Fare) Rules, 2015,
  # as amended in 2026. Hours are measured before the scheduled departure.
  cancellation:
    flat-charges:          # minimum charge per passenger, confirmed tickets (Rs.)
      "[1A]": 240
      "[EC]": 240
      "[2A]": 200
      "[FC]": 200
      "[3A]": 180
      "[CC]": 180
      "[3E]": 180
      "[SL]": 120
      "[2S]": 60
    clerkage: 60           # per passenger, RAC / waitlisted tickets (Rs.)
    gst-rate-percent: 5    # levied on the cancellation charge / clerkage for gst-classes
    gst-classes: [1A, EC, 2A, FC, 3A, CC, 3E]
    quarter-rate-percent: 25
    half-rate-percent: 50
    rac-waitlist-cutoff-minutes: 30
    # Revised slabs for all standard trains, announced 24 Mar 2026 and rolled out 1–15 Apr 2026.
    # Cancellations (IST date) from this day use `current`; earlier ones use `previous`.
    revised-from: ${REFUND_RULES_REVISED_FROM:2026-04-01}
    current:               # > 72 h flat; 72–24 h 25%; 24–8 h 50%; < 8 h no refund
      flat-charge-above-hours: 72
      quarter-charge-from-hours: 24
      confirmed-cutoff-hours: 8
    previous:              # original 2015 slabs: > 48 h flat; 48–12 h 25%; 12–4 h 50%; < 4 h no refund
      flat-charge-above-hours: 48
      quarter-charge-from-hours: 12
      confirmed-cutoff-hours: 4
    # Vande Bharat Sleeper and Amrit Bharat II: G.S.R. 41(E) of 16 Jan 2026 (Commercial Circular 08/2026).
    premium-sleeper:       # > 72 h 25%; 72–8 h 50%; < 8 h no refund; no flat minimum
      early-above-hours: 72
      early-rate-percent: 25
      late-rate-percent: 50
      cutoff-hours: 8
  # Reservation chart timings: Railway Board letter of 16 Dec 2025 (supersedes the July 2025 directive).
  chart:
    first-chart-hours-before: 10
    previous-day-band-start: "05:01"   # inclusive
    previous-day-band-end: "14:00"     # inclusive
    previous-day-chart-time: "20:00"
    final-chart-minutes-before: 30
    effective-from: 2025-12-16

railtime:
  # Public base URL for canonical / Open Graph links. Render sets RENDER_EXTERNAL_URL automatically;
  # SITE_URL overrides it (e.g. for a custom domain).
  site-url: ${SITE_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}
  docs:
    enabled: ${API_DOCS_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  rules-cache-max-age: 1h

springdoc:
  api-docs:
    enabled: ${railtime.docs.enabled}
  swagger-ui:
    enabled: ${railtime.docs.enabled}
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  paths-to-match: /api/**,/public/**
  default-produces-media-type: application/json
