# Local run of the production image. No database or cache is needed —
# every calculation is pure and in-memory.
#   docker compose up --build
services:
  railtime:
    build: .
    image: railtime-calculator:latest
    container_name: railtime-calculator
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      SITE_URL: ${SITE_URL:-http://localhost:8080}
    read_only: true
    tmpfs:
      - /tmp
    # Same readiness signal Render uses (render.yaml healthCheckPath).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped
